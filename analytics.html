<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>猫咪收藏馆 · 数据分析</title>
  <meta name="description" content="猫咪收藏数据分析：标签排行、收藏趋势、分类分布、来源排行。">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><text y='52' font-size='52'>🐱</text></svg>">
  <link rel="stylesheet" href="css/style.css?v=2">
</head>
<body>
  <header class="site-header">
    <div class="nav-wrap">
      <a class="brand" href="index.html">
        <span class="brand-svg"></span>
        <span>猫咪收藏馆</span>
      </a>
      <nav class="nav-links" id="site-nav"></nav>
    </div>
  </header>

  <main>
    <div class="page-head">
      <h1>📊 数据分析</h1>
      <p>看看你的「吸猫」足迹：标签偏好、收藏趋势、分类与来源分布。</p>
    </div>

    <div class="chart-grid">
      <div class="chart-card">
        <h3>🏷️ 标签排行（图片 + 文章）</h3>
        <div class="chart-box"><canvas id="chart-tags"></canvas></div>
      </div>
      <div class="chart-card">
        <h3>📅 收藏时间趋势</h3>
        <div class="chart-box"><canvas id="chart-trend"></canvas></div>
      </div>
      <div class="chart-card">
        <h3>🐈 图片分类分布</h3>
        <div class="chart-box"><canvas id="chart-category"></canvas></div>
      </div>
      <div class="chart-card">
        <h3>🌐 文章来源站排行</h3>
        <div class="chart-box"><canvas id="chart-source"></canvas></div>
      </div>
    </div>

    <div class="stats-grid" id="mini-stats" style="margin-top:32px;"></div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
  <script src="js/common.js?v=2"></script>
  <script src="js/analytics.js?v=2"></script>
</body>
</html>
