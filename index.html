<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>猫咪收藏馆 · 首页</title>
  <meta name="description" content="Conrad 的个人猫咪收藏分析站：猫图与猫文收藏、数据分析。">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><text y='52' font-size='52'>🐱</text></svg>">
  <link rel="stylesheet" href="css/style.css?v=3">
</head>
<body>
  <header class="site-header">
    <div class="nav-wrap">
      <a class="brand" href="index.html">
        <span class="brand-svg"></span>
        <span>猫咪收藏馆</span>
      </a>
      <nav class="nav-links" id="site-nav"></nav>
    </div>
  </header>

  <main>
    <!-- 首屏大图 hero -->
    <section class="segment hero-segment" style="background-image:url('images/hero-wide.svg?v=3')">
      <div class="segment-text light">
        <h2>收集每一份喵的美好</h2>
        <p>Conrad 的个人猫咪收藏馆 —— 收藏猫图与猫文，用数据看看自己的「吸猫」足迹。</p>
        <div class="segment-links">
          <a class="btn-primary" href="gallery.html">浏览图片收藏</a>
          <a class="btn-link light" href="analytics.html">查看数据分析 ›</a>
        </div>
      </div>
    </section>

    <!-- 2 列大图分段 -->
    <div class="grid-2">
      <section class="segment segment-card" style="background-image:url('images/segment-gallery.svg?v=3')">
        <div class="segment-text dark">
          <h3>图片收藏</h3>
          <p>瀑布流浏览收藏的猫咪照片与插画，按分类与标签筛选</p>
          <a class="btn-link" href="gallery.html">进入图库 ›</a>
        </div>
      </section>
      <section class="segment segment-card" style="background-image:url('images/segment-articles.svg?v=3')">
        <div class="segment-text dark">
          <h3>文章收藏</h3>
          <p>科普、养护、行为……收藏值得一读的猫咪文章</p>
          <a class="btn-link" href="articles.html">进入文章 ›</a>
        </div>
      </section>
    </div>

    <!-- 3 列分类入口 -->
    <h2 class="section-title">按分类逛图库</h2>
    <div class="grid-3">
      <a class="cat-card" href="gallery.html">
        <img src="images/orange-sunbath.svg" alt="橘猫" loading="lazy">
        <span class="cat-name">橘猫</span>
      </a>
      <a class="cat-card" href="gallery.html">
        <img src="images/ragdoll-blue-eyes.svg" alt="布偶" loading="lazy">
        <span class="cat-name">布偶</span>
      </a>
      <a class="cat-card" href="gallery.html">
        <img src="images/kitten-yarn.svg" alt="幼猫" loading="lazy">
        <span class="cat-name">幼猫</span>
      </a>
    </div>

    <div class="stats-grid" id="stats-grid"></div>

    <h2 class="section-title">最新收藏的猫图</h2>
    <div class="latest-grid" id="latest-images"></div>

    <h2 class="section-title">最近收藏的文章</h2>
    <div class="latest-grid" id="latest-articles"></div>
  </main>

  <script src="js/common.js?v=3"></script>
  <script src="js/index.js?v=3"></script>
</body>
</html>
