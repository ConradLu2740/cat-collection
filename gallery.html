<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>猫咪收藏馆 · 图片收藏</title>
  <meta name="description" content="猫咪图片收藏瀑布流，支持分类/标签筛选与搜索。">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><text y='52' font-size='52'>🐱</text></svg>">
  <link rel="stylesheet" href="css/style.css?v=3">
</head>
<body>
  <header class="site-header">
    <div class="nav-wrap">
      <a class="brand" href="index.html">
        <span class="brand-svg"></span>
        <span>猫咪收藏馆</span>
      </a>
      <nav class="nav-links" id="site-nav"></nav>
    </div>
  </header>

  <main>
    <div class="page-head">
      <h1>🖼️ 图片收藏</h1>
      <p>按分类、标签浏览收藏的猫咪图片；点击图片可查看大图与详情。</p>
    </div>

    <div class="toolbar">
      <div class="toolbar-row" id="category-filters"></div>
      <div class="toolbar-row" id="tag-filters" style="display:none;"></div>
      <div class="toolbar-row">
        <input type="search" id="search-input" placeholder="🔍 搜索标题、描述…">
        <span style="font-size:13px;color:var(--ink-soft);" id="count-label"></span>
      </div>
    </div>

    <div class="masonry" id="gallery"></div>
    <div class="empty-tip" id="empty-tip" style="display:none;">没有符合条件的图片，换个筛选试试吧 🐾</div>
  </main>

  <!-- 灯箱 -->
  <div class="lightbox" id="lightbox" role="dialog" aria-modal="true">
    <button class="lightbox-close" id="lb-close" aria-label="关闭">✕</button>
    <div class="lightbox-box">
      <img id="lb-img" src="" alt="">
      <div class="lightbox-info">
        <h2 id="lb-title"></h2>
        <div class="note" id="lb-note"></div>
        <div id="lb-meta"></div>
      </div>
    </div>
  </div>

  <script src="js/common.js?v=3"></script>
  <script src="js/gallery.js?v=3"></script>
</body>
</html>
