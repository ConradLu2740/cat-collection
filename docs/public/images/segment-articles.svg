<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="1000" height="700" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F4F4F8"/>
      <stop offset="1" stop-color="#DEDEE7"/>
    </linearGradient>
    <linearGradient id="book" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#EFF0F5"/>
    </linearGradient>
  </defs>
  <rect width="1000" height="700" fill="url(#bg)"/>
  <!-- 背景书本/卡片散落 -->
  <g transform="rotate(-6 200 160)">
    <rect x="110" y="100" width="180" height="120" rx="12" fill="#FFFFFF" stroke="#D8D8DF" stroke-width="2"/>
    <rect x="130" y="122" width="140" height="10" rx="5" fill="#D8D8DF"/>
    <rect x="130" y="144" width="120" height="10" rx="5" fill="#E5E5EC"/>
    <rect x="130" y="166" width="130" height="10" rx="5" fill="#E5E5EC"/>
  </g>
  <g transform="rotate(5 820 170)">
    <rect x="740" y="110" width="170" height="120" rx="12" fill="#FFFFFF" stroke="#D8D8DF" stroke-width="2"/>
    <rect x="758" y="132" width="134" height="10" rx="5" fill="#D8D8DF"/>
    <rect x="758" y="154" width="110" height="10" rx="5" fill="#E5E5EC"/>
    <rect x="758" y="176" width="124" height="10" rx="5" fill="#E5E5EC"/>
  </g>
  <!-- 中央打开的书 -->
  <g>
    <!-- 左页 -->
    <path d="M500 240 Q380 225 300 250 L300 480 Q400 450 500 470 Z" fill="url(#book)" stroke="#C9C9D6" stroke-width="2.5"/>
    <!-- 右页 -->
    <path d="M500 240 Q620 225 700 250 L700 480 Q600 450 500 470 Z" fill="url(#book)" stroke="#C9C9D6" stroke-width="2.5"/>
    <!-- 书脊 -->
    <path d="M500 470 Q495 355 500 240" stroke="#B9B9C8" stroke-width="4" fill="none"/>
    <!-- 左页文字线 -->
    <path d="M340 290 Q420 280 470 288" stroke="#D8D8DF" stroke-width="8" fill="none" stroke-linecap="round"/>
    <path d="M340 320 Q420 310 470 318" stroke="#E3E3EA" stroke-width="8" fill="none" stroke-linecap="round"/>
    <path d="M340 350 Q420 340 470 348" stroke="#E3E3EA" stroke-width="8" fill="none" stroke-linecap="round"/>
    <path d="M340 380 Q410 372 460 380" stroke="#E3E3EA" stroke-width="8" fill="none" stroke-linecap="round"/>
    <path d="M340 410 Q400 404 445 412" stroke="#E3E3EA" stroke-width="8" fill="none" stroke-linecap="round"/>
    <!-- 右页文字线 -->
    <path d="M530 288 Q580 280 660 290" stroke="#D8D8DF" stroke-width="8" fill="none" stroke-linecap="round"/>
    <path d="M530 318 Q580 310 660 320" stroke="#E3E3EA" stroke-width="8" fill="none" stroke-linecap="round"/>
    <path d="M530 348 Q580 340 660 350" stroke="#E3E3EA" stroke-width="8" fill="none" stroke-linecap="round"/>
    <path d="M530 380 Q580 372 660 380" stroke="#E3E3EA" stroke-width="8" fill="none" stroke-linecap="round"/>
    <path d="M530 410 Q575 404 640 412" stroke="#E3E3EA" stroke-width="8" fill="none" stroke-linecap="round"/>
    <!-- 右页猫插画 -->
    <circle cx="595" cy="360" r="52" fill="#F0B8B8"/>
    <path d="M555 332 L543 290 L570 316 Z" fill="#F0B8B8"/>
    <path d="M635 332 L647 290 L620 316 Z" fill="#F0B8B8"/>
    <circle cx="580" cy="360" r="9" fill="#3A2416"/>
    <circle cx="610" cy="360" r="9" fill="#3A2416"/>
    <circle cx="582" cy="358" r="3" fill="#FFF"/>
    <circle cx="612" cy="358" r="3" fill="#FFF"/>
    <path d="M595 372 Q595 382 583 380" stroke="#3A2416" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <path d="M595 372 Q595 382 607 380" stroke="#3A2416" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  </g>
  <!-- 标签/便签 -->
  <g transform="rotate(10 760 560)">
    <rect x="690" y="500" width="180" height="90" rx="10" fill="#FFE9A8" stroke="#E8CE8A" stroke-width="2"/>
    <rect x="706" y="520" width="148" height="9" rx="4" fill="#D9BC6E"/>
    <rect x="706" y="540" width="128" height="9" rx="4" fill="#E5CC84"/>
    <rect x="706" y="560" width="140" height="9" rx="4" fill="#E5CC84"/>
  </g>
  <!-- 铅笔 -->
  <g transform="rotate(24 240 560)">
    <rect x="150" y="540" width="190" height="18" rx="9" fill="#FFD98C" stroke="#E0B35C" stroke-width="2"/>
    <polygon points="340,540 380,549 340,558" fill="#F0C3B8"/>
    <polygon points="376,547 380,549 376,551" fill="#3A2416"/>
    <rect x="150" y="540" width="24" height="18" rx="9" fill="#E8836B"/>
  </g>
</svg>
