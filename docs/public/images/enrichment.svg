<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FDF6E8"/>
      <stop offset="1" stop-color="#F7E3BE"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bg)"/>
  <!-- 逗猫棒手柄 -->
  <g transform="rotate(30 330 60)">
    <rect x="300" y="40" width="14" height="130" rx="7" fill="#8A94A2"/>
    <rect x="300" y="40" width="14" height="130" rx="7" fill="none" stroke="#6E7684" stroke-width="2"/>
  </g>
  <!-- 弹力线 -->
  <path d="M310 180 Q280 200 250 190 Q220 180 205 155" stroke="#B9B9C8" stroke-width="3" fill="none"/>
