    <path d="M200 150 Q190 165 200 178 Q212 185 218 172 Q222 160 210 152 Z" fill="#7BB8FF"/>
    <circle cx="200" cy="150" r="7" fill="#C9761F"/>
  </g>
  <!-- 猫扑过来 -->
  <g transform="rotate(-12 200 200)">
    <ellipse cx="150" cy="240" rx="62" ry="40" fill="#F5A623"/>
    <circle cx="205" cy="185" r="45" fill="#F9C14A"/>
    <path d="M170 162 L150 118 L192 148 Z" fill="#F9C14A"/>
    <path d="M240 162 L260 118 L218 148 Z" fill="#F9C14A"/>
    <path d="M174 158 L160 128 L188 146 Z" fill="#F5A0A0"/>
    <path d="M236 158 L250 128 L222 146 Z" fill="#F5A0A0"/>
