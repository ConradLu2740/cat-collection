    <circle cx="220" cy="185" r="9" fill="#FFF"/>
    <circle cx="196" cy="185" r="6.5" fill="#4A6E28"/>
    <circle cx="220" cy="185" r="6.5" fill="#4A6E28"/>
    <circle cx="198" cy="183" r="2.5" fill="#FFF"/>
    <circle cx="222" cy="183" r="2.5" fill="#FFF"/>
    <path d="M207 200 L213 200 L210 206 Z" fill="#E8836B"/>
    <!-- 前爪抓向羽毛 -->
