  <path d="M90 160 Q75 145 90 130" stroke="#C9761F" stroke-width="2.5" fill="none" opacity="0.5"/>
  <path d="M70 180 Q55 165 70 150" stroke="#C9761F" stroke-width="2.5" fill="none" opacity="0.35"/>
